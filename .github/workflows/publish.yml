name: Publish worker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/facefusion-runpod-worker:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/facefusion-runpod-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Make worker image public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PATCH
          /user/packages/container/facefusion-runpod-worker/visibility
          -f visibility=public
